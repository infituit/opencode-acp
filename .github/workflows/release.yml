name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Check version and prepare release notes
              id: version
              env:
                  TAG: ${{ github.ref_name }}
              shell: bash
              run: |
                  set -euo pipefail
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync, readdirSync, writeFileSync } from "node:fs"

                  const version = /^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-(?<phase>[a-zA-Z]+)\.(?<serial>\d+)(?:-(?<mark>[a-zA-Z0-9][a-zA-Z0-9.-]*))?$/.exec(process.env.TAG)
                  if (!version) {
                      throw new Error("Tag must match v{major}.{minor}.{patch}-{phase}.{serial}[-{mark}]")
                  }
                  appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${version.groups.phase !== "release"}\n`)

                  const pkg = JSON.parse(readFileSync("package.json", "utf8"))
                  const lock = JSON.parse(readFileSync("package-lock.json", "utf8"))
                  if (process.env.TAG !== `v${pkg.version}`) {
                      throw new Error("Tag must match package.json version")
                  }
                  if (lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
                      throw new Error("package-lock.json version must match package.json")
                  }

                  const notes = ["zh", "en"].map((lang) => {
                      const dir = `support-files/changelog/${lang}`
                      const entries = readdirSync(dir).filter((name) =>
                          name.startsWith(`v${pkg.version}_`) && name.endsWith(".md"),
                      )
                      if (entries.length !== 1) {
                          throw new Error(`Expected exactly one ${lang} changelog for v${pkg.version}`)
                      }
                      const text = readFileSync(`${dir}/${entries[0]}`, "utf8")
                      if (!text.includes(`Version: v${pkg.version}`)) {
                          throw new Error(`${lang} changelog must contain Version: v${pkg.version}`)
                      }
                      return text.trim()
                  })
                  writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, notes.join("\n\n---\n\n") + "\n")
                  NODE

            - run: npm ci --ignore-scripts
            - run: npm run typecheck
            - run: npm run check:package

            - name: Pack release assets
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/release-assets"
                  npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-assets"
                  cd "$RUNNER_TEMP/release-assets"
                  sha256sum ./*.tgz > SHA256SUMS

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  PRERELEASE: ${{ steps.version.outputs.prerelease }}
              shell: bash
              run: |
                  set -euo pipefail
                  args=()
                  if [[ "$PRERELEASE" == "true" ]]; then
                      args+=(--prerelease)
                  fi
                  gh release create "$TAG" \
                      "$RUNNER_TEMP/release-assets/"*.tgz \
                      "$RUNNER_TEMP/release-assets/SHA256SUMS" \
                      --verify-tag --title "$TAG" \
                      --notes-file "$RUNNER_TEMP/release-notes.md" \
                      "${args[@]}"

    npm-publish:
        needs: release
        if: github.repository == 'infituit/opencode-acp'
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/npm-publish.yml
        with:
            tag: ${{ github.ref_name }}
