version: 2
# Dependency upgrades are planned manually; disable automatic version-update PRs.
# Security-update PRs are controlled separately in repository settings.
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 0

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 0
